[project]
name = "compendium"
version = "0.1.0"
description = "Personal knowledge synthesis system: ingest sources, synthesize a canonical Markdown wiki, retrieve page-first."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
