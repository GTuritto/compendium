# Dev-only: local backing stores for Compendium development.
# Not a production or production-like deployment. Memgraph (Phase 6) is
# appended here later.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: compendium
      POSTGRES_USER: compendium
      POSTGRES_PASSWORD: compendium
    ports:
      - "5432:5432"
    volumes:
      - compendium-pgdata:/var/lib/postgresql/data

  # OpenSearch: lexical (BM25) index. Single-node, security disabled — local
  # single-user dev only, matching the Postgres dev posture.
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # Required by the image bootstrap even when security is disabled.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Compendium_dev_0
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - compendium-osdata:/usr/share/opensearch/data

  # Qdrant: dense vector index. Host ports are remapped off Qdrant's 6333/6334
  # defaults to 6533/6534 so Compendium coexists with other local Qdrant
  # instances (the container still listens on 6333/6334 internally).
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6533:6333"
      - "6534:6334"
    volumes:
      - compendium-qdrantdata:/qdrant/storage

volumes:
  compendium-pgdata:
  compendium-osdata:
  compendium-qdrantdata:
